# Gate de verificación en CI: los mismos 8 comandos que AGENTS.md exige correr limpios en la misma corrida, más la auditoría de dependencias (GT-23).
#   estático    → tsc, lint, arquitectura (dependency-cruiser), código muerto (knip), auditar:dependencias
#   build       → npm run build + npm run plataforma:build (con su propia base migrada)
#   integración → npm test (Vitest contra Postgres real), repartido en PARTES_VITEST jobs con `--shard`
#   conteo      → comprueba que las partes juntas corrieron todos los archivos de test una sola vez y suma los conteos
#   e2e         → npm run test:e2e (Playwright, servidor de producción)
# El job `gate` es el ÚNICO que hay que marcar como requerido en la protección de rama / Vercel Deployment Checks: falla si cualquiera
# de los otros no terminó en verde (un job omitido o cancelado también lo hace fallar).
# No usa secretos: las bases son un Postgres descartable del propio runner y las claves de abajo son de ese contenedor, no de ningún entorno real.
# Las actions están fijadas por SHA de 40 caracteres (la etiqueta se anota al lado); Dependabot (`github-actions`) propone las actualizaciones.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  # `main` tiene una regla que exige el job `gate`: sin este disparador un pull request hacia `main` nunca lo ejecutaría y no se podría integrar.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Rol dueño de las tablas (el que migra) y rol de ejecución sin privilegios (ADR-007, A0), como en local.
  CLAVE_DUENIO: ci-duenio-descartable
  CLAVE_APP: ci-app-descartable
  CLAVE_PLATAFORMA: ci-plataforma-descartable
  # Rol de PRUEBAS (M.3-A8): con el que los fixtures de Vitest y de Playwright SIEMBRAN datos (`motor2_app_pruebas`: mismos privilegios que `motor2_app`, pero NO miembro de él, así las políticas
  # por sucursal de la Fase B no lo alcanzan). Solo existe en las bases del runner; el código bajo prueba sigue corriendo como `motor2_app`.
  CLAVE_PRUEBAS: ci-pruebas-descartable
  # Variables que Prisma/Auth.js exigen para arrancar; valores de relleno, nunca reales.
  AUTH_SECRET: ci-auth-secret-de-relleno-0123456789abcdef
  AUTH_GOOGLE_ID: ci-google-id
  AUTH_GOOGLE_SECRET: ci-google-secret
  # En cuántas partes se reparte Vitest (tiene que coincidir con la lista de `matrix.parte` del job `integracion`: un paso de control lo comprueba contra `strategy.job-total`, y el job `conteo`
  # exige exactamente esta cantidad de resultados).
  PARTES_VITEST: "4"

jobs:
  estatico:
    name: Estático (tipos, lint, arquitectura, código muerto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # knip carga `playwright.config.ts` para descubrir los specs, y esa config valida (sin conectarse) la forma de estas URLs: sin ellas no se
    # lee la config y knip da por muertos global-setup/global-teardown. Acá no hay base; son los mismos valores de relleno del job e2e.
    env:
      MOTOR2_E2E_DATABASE_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_e2e
      MOTOR2_E2E_APP_DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `prisma/fase-a/smoke-test.ts` importa el cliente aislado de la Fase A (node_modules/.prisma/fase-a-client), que solo existe si se genera; sin él knip
      # lo marca como import sin resolver. No necesita base ni variables: solo lee el schema.
      - name: Cliente de Prisma de la Fase A (para que knip resuelva su smoke test)
        run: npx prisma generate --config prisma/fase-a/prisma.config.ts
      - run: npx tsc --noEmit
      # ESLint llegó al tope de memoria por defecto de Node en el runner (OOM, código 134) cuando el repo creció con la consola de plataforma: se le da más.
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run arquitectura
      - run: npm run analizar:muerto
      # Cadena de suministro (GT-23, E.7): falla ante un aviso alto o crítico de las dependencias de producción que no tenga una excepción vigente en
      # `scripts/auditoria-dependencias-excepciones.ts`. Consulta el registro de npm: depende de la red y de avisos nuevos, a propósito (un aviso nuevo pone rojo el Gate).
      - run: npm run auditar:dependencias

  # El build en su propio job (corre en paralelo con los tests): `scripts/construir.ts` corre `prisma migrate status` y el chequeo del registro de módulos contra la base, así que lleva
  # su propio Postgres con los mismos pasos de preparación que `integracion`. Ya no corre antes de los tests, y no hace falta: cada job tiene su base y esta nunca recibe los datos de prueba.
  build:
    name: Build (npm run build + plataforma:build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motor2
          POSTGRES_PASSWORD: ci-duenio-descartable
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: motor2
      PGPASSWORD: ci-duenio-descartable
      DIRECT_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_dev
      DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_dev
      # M.3-A8: igual que en `integracion` (el guardián del rol de pruebas pide la misma forma en todo job que prepara la base); el build no siembra nada.
      MOTOR2_PRUEBAS_DATABASE_URL: postgresql://motor2_app_pruebas:ci-pruebas-descartable@localhost:5432/motor2_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Los roles se crean ANTES de migrar (los privilegios por defecto aplican a las tablas que cree la migración). `-v clave_pruebas` crea además el rol de pruebas (M.3-A8).
      - name: Bases y rol de ejecución
        run: |
          createdb motor2_dev
          createdb motor2_e2e
          psql -d postgres -v ON_ERROR_STOP=1 -v clave="$CLAVE_APP" -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - name: Migrar (como dueño)
        run: npx prisma migrate deploy
      # Rol de plataforma (E4, ADR-012 §3): DESPUÉS de migrar, para que el script le dé permiso a las tablas de la consola.
      - name: Rol de plataforma
        run: psql -d motor2_dev -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
      # M.3-A8: las migraciones recortaron privilegios SOLO de `motor2_app` (auditoría inmutable, invitaciones…). `solo_pruebas=1` no toca a `motor2_app`: copia sus privilegios al rol de pruebas (y falla si difieren).
      - name: Rol de pruebas (privilegios al día tras migrar)
        run: psql -d postgres -v ON_ERROR_STOP=1 -v solo_pruebas=1 -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      # El build verifica el registro de módulos de la base.
      - name: npm run build
        run: npm run build
      # La consola de plataforma (E4) es otra app Next: su build también tiene que compilar. No toca la base.
      - name: npm run plataforma:build
        run: npm run plataforma:build

  # Vitest repartido en partes (`--shard=i/n`): cada parte es un job con SU Postgres y SU base (por eso no hace falta renombrar bases ni cambiar los scripts de roles). El job `conteo` comprueba después que las
  # partes juntas corrieron todos los archivos una sola vez.
  integracion:
    name: Integración (npm test, parte ${{ matrix.parte }} de ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motor2
          POSTGRES_PASSWORD: ci-duenio-descartable
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: motor2
      PGPASSWORD: ci-duenio-descartable
      DIRECT_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_dev
      DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_dev
      # M.3-A8: con esta URL (rol de pruebas, MISMA base) siembran los fixtures de Vitest; el código bajo prueba usa DATABASE_URL (motor2_app).
      MOTOR2_PRUEBAS_DATABASE_URL: postgresql://motor2_app_pruebas:ci-pruebas-descartable@localhost:5432/motor2_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Los roles se crean ANTES de migrar (los privilegios por defecto aplican a las tablas que cree la migración). `-v clave_pruebas` crea además el rol de pruebas (M.3-A8).
      - name: Bases y rol de ejecución
        run: |
          createdb motor2_dev
          createdb motor2_e2e
          psql -d postgres -v ON_ERROR_STOP=1 -v clave="$CLAVE_APP" -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - name: Migrar (como dueño)
        run: npx prisma migrate deploy
      # Rol de plataforma (E4, ADR-012 §3): DESPUÉS de migrar, para que el script le dé permiso a las tablas de la consola. Lo usan los tests con el rol real.
      - name: Rol de plataforma
        run: psql -d motor2_dev -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
      # M.3-A8: las migraciones recortaron privilegios SOLO de `motor2_app` (auditoría inmutable, invitaciones…). `solo_pruebas=1` no toca a `motor2_app`: copia sus privilegios al rol de pruebas (y falla si difieren).
      - name: Rol de pruebas (privilegios al día tras migrar)
        run: psql -d postgres -v ON_ERROR_STOP=1 -v solo_pruebas=1 -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      # Control: la lista de `matrix.parte` y PARTES_VITEST dicen lo mismo. Si no, `--shard=i/n` repartiría en otra cantidad de partes que las que `conteo` espera y habría archivos sin correr.
      - name: Control de la cantidad de partes
        run: test "${{ strategy.job-total }}" = "$PARTES_VITEST"
      # Además del reporte normal, Vitest deja el resultado en un JSON: si algo falla, el paso de abajo lista los tests rojos al FINAL del log (el log de los tests es larguísimo y el ruido del contenedor de Postgres tapa el final).
      # `--shard=i/n` reparte los archivos de test entre las partes (Vitest los reparte por cantidad de archivos, con un hash de la ruta).
      - name: npm test
        run: npm test -- --shard=${{ matrix.parte }}/${{ strategy.job-total }} --reporter=default --reporter=json --outputFile.json=resultado-vitest.json
        env:
          PLATAFORMA_DATABASE_URL: postgresql://motor2_plataforma:ci-plataforma-descartable@localhost:5432/motor2_dev
      - name: Tests que fallaron (resumen al final del log)
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("resultado-vitest.json")) { console.log("No hay resultado-vitest.json: la corrida de Vitest no llegó a escribirlo (falló antes o se cortó)."); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("resultado-vitest.json", "utf8"));
            const rojos = [];
            for (const archivo of r.testResults ?? []) {
              if (archivo.status === "failed" && !(archivo.assertionResults ?? []).some((t) => t.status === "failed")) rojos.push({ archivo: archivo.name, test: "(el archivo entero falló al cargarse)", mensaje: archivo.message });
              for (const t of archivo.assertionResults ?? []) if (t.status === "failed") rojos.push({ archivo: archivo.name, test: t.fullName, mensaje: (t.failureMessages ?? []).join("\n") });
            }
            console.log("===== TESTS QUE FALLARON: " + rojos.length + " =====");
            for (const f of rojos) console.log("\n--- " + f.archivo.replace(process.cwd() + "/", "") + "\n    " + f.test + "\n" + String(f.mensaje ?? "").split("\n").filter((l) => !l.includes("node_modules")).slice(0, 40).join("\n"));
          '
      # El resultado de ESTA parte, para que `conteo` junte las cuatro. `if-no-files-found: ignore`: si la parte no llegó a escribirlo, `conteo` falla por la cantidad de resultados (y lo dice).
      - name: Resultado de Vitest de esta parte (artefacto)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultado-vitest-${{ matrix.parte }}
          path: resultado-vitest.json
          if-no-files-found: ignore
          retention-days: 7

  # Comprueba que el reparto no perdió ni duplicó nada: exactamente PARTES_VITEST resultados, ningún archivo de test en dos partes, ningún archivo de `vitest list` sin correr; suma los conteos y calcula la huella
  # (sha256 de la lista ordenada «ruta::nombre completo::estado»), que se compara a ojo con la de la línea de base de una sola corrida.
  conteo:
    name: Conteo de tests (todas las partes)
    needs: [integracion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resultado-vitest-*
          path: partes
          merge-multiple: false
      - name: Conteo y chequeos del reparto
        run: |
          npx vitest list --filesOnly --json > lista-vitest.json
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const raiz = process.cwd() + "/";
          const errores = [];
          const rel = (ruta) => (ruta.startsWith(raiz) ? ruta.slice(raiz.length) : ruta);
          const jsons = [];
          const recorrer = (dir) => { for (const e of fs.readdirSync(dir, { withFileTypes: true })) { const p = path.join(dir, e.name); if (e.isDirectory()) recorrer(p); else if (e.name.endsWith(".json")) jsons.push(p); } };
          if (fs.existsSync("partes")) recorrer("partes");
          jsons.sort();
          const esperadas = Number(process.env.PARTES_VITEST);
          if (jsons.length !== esperadas) errores.push("Hay " + jsons.length + " resultados de Vitest y tendría que haber exactamente " + esperadas + " (PARTES_VITEST): " + JSON.stringify(jsons));
          const lineas = [];
          const dueno = new Map();
          const suma = { archivos: 0, numTotalTests: 0, numPassedTests: 0, numPendingTests: 0, numFailedTests: 0, numTodoTests: 0 };
          const porParte = [];
          for (const json of jsons) {
            const r = JSON.parse(fs.readFileSync(json, "utf8"));
            const archivos = r.testResults ?? [];
            porParte.push("- " + json + ": " + archivos.length + " archivos, " + r.numTotalTests + " tests");
            suma.archivos += archivos.length;
            for (const k of ["numTotalTests", "numPassedTests", "numPendingTests", "numFailedTests", "numTodoTests"]) suma[k] += r[k] ?? 0;
            for (const archivo of archivos) {
              const ruta = rel(archivo.name);
              if (dueno.has(ruta)) errores.push("El archivo " + ruta + " aparece en dos partes: " + dueno.get(ruta) + " y " + json);
              else dueno.set(ruta, json);
              for (const t of archivo.assertionResults ?? []) lineas.push(ruta + "::" + t.fullName + "::" + t.status);
            }
          }
          const lista = JSON.parse(fs.readFileSync("lista-vitest.json", "utf8")).map((x) => rel(x.file));
          const faltan = lista.filter((ruta) => !dueno.has(ruta));
          if (faltan.length) errores.push("Faltan " + faltan.length + " archivos de test de `vitest list` que ninguna parte corrió: " + faltan.slice(0, 20).join(", ") + (faltan.length > 20 ? ", …" : ""));
          const enLista = new Set(lista);
          const sobran = [...dueno.keys()].filter((ruta) => !enLista.has(ruta));
          lineas.sort();
          const huella = crypto.createHash("sha256").update(lineas.join("\n")).digest("hex");
          const texto = [
            "## Conteo de Vitest (todas las partes)",
            ...porParte,
            "- archivos de `vitest list`: " + lista.length,
            "- archivos (suma de las partes): " + suma.archivos,
            "- numTotalTests: " + suma.numTotalTests,
            "- numPassedTests: " + suma.numPassedTests,
            "- numPendingTests: " + suma.numPendingTests,
            "- numFailedTests: " + suma.numFailedTests,
            "- numTodoTests: " + suma.numTodoTests,
            "- sha256 de la lista ordenada ruta::nombre::estado: " + huella,
            ...(sobran.length ? ["- aviso: " + sobran.length + " archivos corridos que `vitest list` no lista: " + sobran.slice(0, 20).join(", ")] : []),
            ...(errores.length ? ["", "### ERRORES", ...errores.map((e) => "- " + e)] : []),
          ].join("\n");
          console.log(texto);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, texto + "\n");
          if (errores.length) process.exit(1);
          EOF

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motor2
          POSTGRES_PASSWORD: ci-duenio-descartable
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: motor2
      PGPASSWORD: ci-duenio-descartable
      DIRECT_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_e2e
      DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_e2e
      MOTOR2_E2E_DATABASE_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_e2e
      MOTOR2_E2E_APP_DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_e2e
      # M.3-A8: con esta URL (rol de pruebas, MISMA base `_e2e`) siembran los specs de Playwright; el servidor de la app sigue corriendo como `motor2_app`.
      MOTOR2_E2E_PRUEBAS_DATABASE_URL: postgresql://motor2_app_pruebas:ci-pruebas-descartable@localhost:5432/motor2_e2e
      # La consola de plataforma (E4): su servidor y su spec solo se activan con esta variable (el rol se crea más abajo).
      MOTOR2_E2E_PLATAFORMA_DATABASE_URL: postgresql://motor2_plataforma:ci-plataforma-descartable@localhost:5432/motor2_e2e
      # ADR-025: la SEGUNDA instalación de la consola (otra base, también `_e2e`): el spec consola-instalaciones prueba que una consola opera dos bases sin mezclarlas.
      MOTOR2_E2E_B_DATABASE_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_b_e2e
      MOTOR2_E2E_B_PLATAFORMA_DATABASE_URL: postgresql://motor2_plataforma:ci-plataforma-descartable@localhost:5432/motor2_b_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bases y rol de ejecución
        run: |
          createdb motor2_dev
          createdb motor2_e2e
          createdb motor2_b_e2e
          psql -d postgres -v ON_ERROR_STOP=1 -v clave="$CLAVE_APP" -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - name: Migrar la base E2E (como dueño)
        run: npx prisma migrate deploy
      - name: Migrar la base E2E B (segunda instalación)
        run: DIRECT_URL="$MOTOR2_E2E_B_DATABASE_URL" npx prisma migrate deploy
      # DESPUÉS de migrar (el script da permiso a las tablas de la consola) y sobre la base E2E: el servidor de la consola conecta con este rol.
      - name: Rol de plataforma (consola)
        run: psql -d motor2_e2e -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
      # El rol es del servidor entero (la misma clave); el script es idempotente y le da permiso sobre las tablas de ESTA base.
      - name: Rol de plataforma en la segunda base
        run: psql -d motor2_b_e2e -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
      # M.3-A8: igual que en el job de integración. El script solo toca `motor2_dev` y `motor2_e2e` (la segunda instalación `motor2_b_e2e` es de la consola y no lleva rol de pruebas).
      - name: Rol de pruebas (privilegios al día tras migrar)
        run: psql -d postgres -v ON_ERROR_STOP=1 -v solo_pruebas=1 -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - run: npx playwright install --with-deps chromium
      - name: npm run test:e2e
        run: npm run test:e2e
      # Línea de base del reparto del CI: el JSON de Playwright (`resultado-playwright.json`, reporter agregado en playwright.config.ts) trae las cuatro cuentas en `stats`.
      - name: Conteo (línea de base)
        if: always()
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          if (!fs.existsSync("resultado-playwright.json")) { console.log("No hay resultado-playwright.json: la corrida de Playwright no llegó a escribirlo."); process.exit(0); }
          const s = JSON.parse(fs.readFileSync("resultado-playwright.json", "utf8")).stats ?? {};
          const texto = [
            "## Conteo de Playwright (línea de base, un solo runner)",
            "- total: " + (s.expected + s.unexpected + s.flaky + s.skipped),
            "- pasados: " + s.expected,
            "- salteados: " + s.skipped,
            "- flaky (pasaron en el reintento): " + s.flaky,
            "- fallados: " + s.unexpected,
          ].join("\n");
          console.log(texto);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, texto + "\n");
          EOF
      - name: Resultado de Playwright (artefacto)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultado-playwright
          path: resultado-playwright.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Trazas de los specs que fallaron
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Gate (requerido)
    if: always()
    needs: [estatico, build, integracion, conteo, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los jobs terminaron en verde
        run: |
          echo "estatico=${{ needs.estatico.result }} build=${{ needs.build.result }} integracion=${{ needs.integracion.result }} conteo=${{ needs.conteo.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.estatico.result }}" = "success" -a "${{ needs.build.result }}" = "success" -a "${{ needs.integracion.result }}" = "success" -a "${{ needs.conteo.result }}" = "success" -a "${{ needs.e2e.result }}" = "success"
