# DIAGNÓSTICO TEMPORAL (se borra al terminar): corre SOLO el test de volumen del historial contra Postgres 17, sobre dos commits.
name: Diag historial
on:
  push:
    branches: ["diag-historial"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: ["71be34a0047fcfb4f5e7b4a9025657a0dd4ef188", "183f1025c91cafa6a84ccc8fb31ca9cf9bc803cc"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motor2
          POSTGRES_PASSWORD: ci-duenio-descartable
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: motor2
      PGPASSWORD: ci-duenio-descartable
      DIRECT_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_dev
      DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_dev
      MOTOR2_PRUEBAS_DATABASE_URL: postgresql://motor2_app_pruebas:ci-pruebas-descartable@localhost:5432/motor2_dev
      PLATAFORMA_DATABASE_URL: postgresql://motor2_plataforma:ci-plataforma-descartable@localhost:5432/motor2_dev
      CLAVE_APP: ci-app-descartable
      CLAVE_PRUEBAS: ci-pruebas-descartable
      CLAVE_PLATAFORMA: ci-plataforma-descartable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bases, roles y migraciones
        run: |
          createdb motor2_dev
          createdb motor2_e2e
          psql -d postgres -v ON_ERROR_STOP=1 -v clave="$CLAVE_APP" -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
          npx prisma migrate deploy
          psql -d motor2_dev -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
          psql -d postgres -v ON_ERROR_STOP=1 -v solo_pruebas=1 -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - name: Muestreo de actividad de Postgres (segundo plano)
        run: |
          nohup bash -c 'while true; do date -u +%T; psql -d motor2_dev -Atc "select pid,state,wait_event_type,wait_event,now()-query_start as dur,left(query,150) from pg_stat_activity where datname='"'"'motor2_dev'"'"' and state<>'"'"'idle'"'"' and pid<>pg_backend_pid()"; sleep 10; done' > actividad.log 2>&1 &
      - name: Test de volumen del historial (dos veces)
        run: |
          set +e
          npx vitest run test/reportes/historial-producto-volumen.test.ts 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "✓|×|❯|FAIL|Error|Duration|Tests " | cut -c1-200
          echo "--- segunda vuelta"
          npx vitest run test/reportes/historial-producto-volumen.test.ts 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "✓|×|❯|FAIL|Error|Duration|Tests " | cut -c1-200
      - name: Actividad registrada
        if: always()
        run: tail -80 actividad.log
