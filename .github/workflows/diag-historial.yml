# DIAGNÓSTICO TEMPORAL (se borra al terminar): corre SOLO el test de volumen del historial contra Postgres 17, sobre dos commits.
name: Diag historial
on:
  push:
    branches: ["diag-historial"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: ["71be34a0047fcfb4f5e7b4a9025657a0dd4ef188"]
        rep: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: motor2
          POSTGRES_PASSWORD: ci-duenio-descartable
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: motor2
      PGPASSWORD: ci-duenio-descartable
      DIRECT_URL: postgresql://motor2:ci-duenio-descartable@localhost:5432/motor2_dev
      DATABASE_URL: postgresql://motor2_app:ci-app-descartable@localhost:5432/motor2_dev
      MOTOR2_PRUEBAS_DATABASE_URL: postgresql://motor2_app_pruebas:ci-pruebas-descartable@localhost:5432/motor2_dev
      PLATAFORMA_DATABASE_URL: postgresql://motor2_plataforma:ci-plataforma-descartable@localhost:5432/motor2_dev
      CLAVE_APP: ci-app-descartable
      CLAVE_PRUEBAS: ci-pruebas-descartable
      CLAVE_PLATAFORMA: ci-plataforma-descartable
      AUTH_SECRET: ci-auth-secret-de-relleno-0123456789abcdef
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
      CLAVE_DUENIO: ci-duenio-descartable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bases, roles y migraciones
        run: |
          createdb motor2_dev
          createdb motor2_e2e
          psql -d postgres -v ON_ERROR_STOP=1 -v clave="$CLAVE_APP" -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
          npx prisma migrate deploy
          psql -d motor2_dev -v ON_ERROR_STOP=1 -v clave="$CLAVE_PLATAFORMA" -f scripts/operaciones/crear-rol-motor2-plataforma.sql
          psql -d postgres -v ON_ERROR_STOP=1 -v solo_pruebas=1 -v clave_pruebas="$CLAVE_PRUEBAS" -f scripts/operaciones/crear-rol-motor2-app.sql
      - name: auto_explain (planes de las consultas internas de las claves foráneas)
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DATABASE motor2_dev SET session_preload_libraries = 'auto_explain';
          ALTER DATABASE motor2_dev SET auto_explain.log_min_duration = '1ms';
          ALTER DATABASE motor2_dev SET auto_explain.log_nested_statements = on;
          ALTER DATABASE motor2_dev SET auto_explain.sample_rate = 1;
          ALTER DATABASE motor2_dev SET auto_explain.log_analyze = off;
          SQL
      - name: Muestreo de consultas lentas o bloqueadas (segundo plano)
        run: |
          cat > muestreo.sql <<'SQL'
          select now()::time(0) as hora, pid, state, wait_event_type||':'||coalesce(wait_event,'') as espera, pg_blocking_pids(pid) as bloqueado_por,
                 round(extract(epoch from now()-query_start)) as seg, left(regexp_replace(query,'\s+',' ','g'),160) as consulta
          from pg_stat_activity
          where datname='motor2_dev' and pid<>pg_backend_pid() and state<>'idle' and now()-query_start > interval '8 seconds';
          SQL
          nohup bash -c 'while true; do psql -d motor2_dev -At -F " | " -f muestreo.sql; sleep 5; done' > actividad.log 2>&1 &
      - name: Parte 2 de 4 completa
        run: |
          set +e
          npm test -- --shard=2/4 --reporter=default --reporter=json --outputFile.json=resultado-vitest.json 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "^ (✓|❯|×) test|FAIL|Test Files|Tests  |Duration" | cut -c1-200 > resultado.log
          tail -12 resultado.log
      - name: Actividad registrada
        if: always()
        run: |
          echo "líneas: $(wc -l < actividad.log)"; head -60 actividad.log
          echo "--- archivos lentos"; grep -E "[0-9]{4,}ms" resultado.log | head -20
