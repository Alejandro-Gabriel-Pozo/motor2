name: Seed demo pizzería (manual, one-off)

# Job temporal: corre scripts/seed-demo-pizzeria.ts desde un runner cerca de
# Neon (us-east, mucha menor latencia que desde un ISP residencial en
# Argentina) — pensado para correrse UNA vez sobre una branch de Neon
# limpia y borrarse (workflow + secret) apenas termine.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run --config vitest.seed.config.ts
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
