version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Poco ruido (decisión del dueño, 2026-11-07): como mucho 2 PR abiertos, y sin reactualizarlos cada vez que cambia `main`
    # (cada reactualización dispara una corrida completa del CI y compite por los runners con el trabajo en curso).
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
    # El primer grupo que coincide gana: prisma y next primero; el resto de las menores y parches, en un solo PR.
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
      next:
        patterns: ["next", "eslint-config-next"]
      menores-y-parches:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Actions de los workflows (fijadas por SHA): Dependabot propone el SHA nuevo con la etiqueta en el comentario. Las ramas `dependabot/…` no despliegan (vercel.json).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    # Todas las acciones en un solo PR (se revisa y se prueba junto).
    groups:
      acciones:
        patterns: ["*"]
