services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: motor2
      POSTGRES_PASSWORD: motor2
      POSTGRES_DB: motor2_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - motor2_pgdata:/var/lib/postgresql/data

volumes:
  motor2_pgdata:
